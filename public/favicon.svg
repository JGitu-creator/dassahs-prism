      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="d-prism" x1="18" y1="15" x2="48" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
